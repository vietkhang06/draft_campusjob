services:
  postgres:
    image: postgres:16-alpine
    container_name: campusjob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusjob
      POSTGRES_PASSWORD: campusjob_password
      POSTGRES_DB: campusjob
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U campusjob -d campusjob" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.18
    container_name: campusjob-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  mailpit_data:
